    <style>
      /* 1. Fix the 100vw bug by removing default browser margins */
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden; /* Kills horizontal scrolling */
        background-color: #080808; /* Prevents white flashes during load */
      }

      /* 2. Hide scrollbars but keep scrolling functionality */
      ::-webkit-scrollbar {
        display: none; /* Chrome, Safari, Opera */
      }
      * {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }
    </style>
  </head>
